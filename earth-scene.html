
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora — Global Power Grid</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#scene{width:100%;height:100%;overflow:hidden;background:#06111f}
body{font-family:Arial,Helvetica,sans-serif}
#scene{position:absolute;inset:0}
canvas{display:block}
.heading{position:absolute;z-index:2;top:25px;left:27px;pointer-events:none}
.eyebrow{color:#65eaff;font-size:11px;font-weight:bold;letter-spacing:3.5px;margin-bottom:10px}
h1{font-size:clamp(23px,3.7vw,36px);line-height:1.12;color:#eafaff;letter-spacing:-1px;text-shadow:0 0 20px #00a9db66}
h1 span{color:#60e8ff}
.subtitle{font-size:11px;letter-spacing:1.7px;color:#8db9d0;margin-top:10px}
.metrics{position:absolute;z-index:3;right:23px;top:50%;transform:translateY(-40%);width:158px;display:grid;gap:12px;pointer-events:none}
.metric{padding:13px 14px;border:1px solid #35cafa66;border-radius:15px;background:#091b2be8;backdrop-filter:blur(10px)}
.label{font-size:10px;color:#94bfd4;letter-spacing:1.4px}
.value{font-size:27px;font-weight:bold;color:#79efff;margin-top:5px}
.unit{font-size:12px}
.note{font-size:10px;color:#8daabd;margin-top:4px}
.legend{position:absolute;bottom:45px;left:25px;z-index:2;display:grid;gap:7px;font-size:9px;letter-spacing:.7px;color:#87adbf;pointer-events:none}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:17px;height:2px;background:#29cfff;box-shadow:0 0 7px #29cfff}
.legend .bright{background:#a4fff5;box-shadow:0 0 8px #a4fff5}
.footer{position:absolute;z-index:2;bottom:18px;left:24px;right:24px;display:flex;justify-content:space-between;color:#84a9bc;font-size:9px;letter-spacing:1px;pointer-events:none}
.live{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;background:#6effd7;border-radius:50%;box-shadow:0 0 10px #6effd7;animation:blink 1.3s infinite}
.frame{position:absolute;z-index:4;inset:13px;border:1px solid #4dc8ef30;border-radius:23px;pointer-events:none}
@keyframes blink{50%{opacity:.35}}
@media(max-width:620px){
.heading{top:23px;left:22px}
.eyebrow{font-size:9px;letter-spacing:2px}
h1{font-size:26px}
.subtitle{font-size:9px}
.metrics{top:auto;bottom:65px;right:19px;transform:none;width:126px;gap:7px}
.metric{padding:9px;border-radius:11px}
.label{font-size:8px;letter-spacing:.7px}
.value{font-size:22px}
.note{font-size:8px}
.legend{left:21px;bottom:45px;font-size:8px;gap:6px}
.footer{left:21px;right:21px;font-size:8px}
.frame{inset:8px;border-radius:17px}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="scene"></div>

<div class="heading">
  <div class="eyebrow">LUMORA / ENERGY INTELLIGENCE</div>
  <h1>Powering a <span>Brighter</span><br>Connected World.</h1>
  <div class="subtitle">ULTRA-DENSE GLOBAL ENERGY NETWORK</div>
</div>

<div class="metrics">
  <div class="metric">
    <div class="label">GRID VOLTAGE</div>
    <div class="value">230 <span class="unit">V</span></div>
    <div class="note">Illustrative demo</div>
  </div>
  <div class="metric">
    <div class="label">ENERGY FLOW</div>
    <div class="value">3.8 <span class="unit">kW</span></div>
    <div class="note">Illustrative demo</div>
  </div>
  <div class="metric">
    <div class="label">CONSUMPTION</div>
    <div class="value">248.6 <span class="unit">kWh</span></div>
    <div class="note">Sample data only</div>
  </div>
</div>

<div class="legend">
  <span><i></i> DENSE GRID CONNECTIONS</span>
  <span><i class="bright"></i> MOVING ENERGY PULSES</span>
</div>

<div class="footer">
  <span class="live"><i class="dot"></i> ROTATING PLANET</span>
  <span>GLOBAL POWER NETWORK</span>
</div>
<div class="frame"></div>

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const container = document.getElementById("scene");
const scene = new THREE.Scene();
scene.background = new THREE.Color("#06111f");

const camera = new THREE.PerspectiveCamera(
  43, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.z = 8.8;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const earthGroup = new THREE.Group();
scene.add(earthGroup);

const R = 2.28;

// Earth surface
const earthMaterial = new THREE.MeshPhongMaterial({
  color: 0x1c6fa5,
  shininess: 22,
  specular: new THREE.Color(0x163f63)
});
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(R, 72, 56),
  earthMaterial
);
earthGroup.add(earth);

new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",
  texture => {
    texture.colorSpace = THREE.SRGBColorSpace;
    earthMaterial.map = texture;
    earthMaterial.color.set(0xffffff);
    earthMaterial.needsUpdate = true;
  },
  undefined,
  () => console.info("Using fallback blue globe")
);

// Atmosphere
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.045, 48, 36),
  new THREE.MeshBasicMaterial({
    color: 0x0baaff,
    transparent: true,
    opacity: 0.075,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
));

// Lighting
scene.add(new THREE.AmbientLight(0x91c9ed, 1.45));

const sun = new THREE.DirectionalLight(0xc7efff, 2.3);
sun.position.set(-4, 4, 6);
scene.add(sun);

const fill = new THREE.PointLight(0x00aaff, 26, 12);
fill.position.set(2, -1, 3);
scene.add(fill);

// Stars
const starPositions = [];
for (let i = 0; i < 1000; i++) {
  const radius = 5 + Math.random() * 14;
  const theta = Math.random() * Math.PI * 2;
  const u = Math.random() * 2 - 1;
  const q = Math.sqrt(1 - u * u);
  starPositions.push(
    radius * q * Math.cos(theta),
    radius * q * Math.sin(theta),
    radius * u
  );
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: 0x8bdfff,
    size: 0.018,
    transparent: true,
    opacity: 0.65
  })
);
scene.add(stars);

// Dense geographic mesh
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.008, 42, 30),
  new THREE.MeshBasicMaterial({
    color: 0x31bdff,
    wireframe: true,
    transparent: true,
    opacity: 0.24,
    depthWrite: false
  })
));

// Random uniform points on the sphere
function randomSpherePoint(radius) {
  const z = Math.random() * 2 - 1;
  const angle = Math.random() * Math.PI * 2;
  const horizontal = Math.sqrt(1 - z * z);

  return new THREE.Vector3(
    radius * horizontal * Math.cos(angle),
    radius * z,
    radius * horizontal * Math.sin(angle)
  );
}

// Smooth curved path from one surface point to another.
// Routes use different heights, so lines cross and overlap.
function makeArc(start, end, lift, segments = 38) {
  const a = start.clone().normalize();
  const b = end.clone().normalize();
  const angle = a.angleTo(b);
  const points = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    let direction;

    if (angle < 0.001 || Math.abs(Math.sin(angle)) < 0.0001) {
      direction = a.clone().lerp(b, t).normalize();
    } else {
      const denominator = Math.sin(angle);
      direction = a.clone()
        .multiplyScalar(Math.sin((1 - t) * angle) / denominator)
        .add(
          b.clone().multiplyScalar(Math.sin(t * angle) / denominator)
        )
        .normalize();
    }

    // Lift the middle of each line above the globe surface.
    const arch = Math.pow(Math.sin(Math.PI * t), 0.85);
    const radius = R * 1.018 + 0.035 + arch * lift;

    points.push(direction.multiplyScalar(radius));
  }

  return points;
}

const network = new THREE.Group();
earthGroup.add(network);

const tracks = [];
const routeMaterials = [
  new THREE.LineBasicMaterial({
    color: 0x21caff,
    transparent: true,
    opacity: 0.46,
    depthWrite: false
  }),
  new THREE.LineBasicMaterial({
    color: 0x1688df,
    transparent: true,
    opacity: 0.34,
    depthWrite: false
  }),
  new THREE.LineBasicMaterial({
    color: 0x42e8ff,
    transparent: true,
    opacity: 0.30,
    depthWrite: false
  }),
  new THREE.LineBasicMaterial({
    color: 0x1260aa,
    transparent: true,
    opacity: 0.42,
    depthWrite: false
  })
];

// Add one route to the globe.
function addRoute(start, end, index, options = {}) {
  const distance = start.distanceTo(end);
  const lift = options.lift ??
    (0.08 + Math.random() * 0.58 +
      Math.min(distance * 0.11, 0.35));

  const points = makeArc(start, end, lift, options.segments || 34);

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = options.material ||
    routeMaterials[index % routeMaterials.length];

  const line = new THREE.Line(geometry, material);
  network.add(line);

  if (options.pulse !== false) {
    tracks.push({
      points,
      speed: 0.12 + Math.random() * 0.42,
      phase: Math.random(),
      size: 0.018 + Math.random() * 0.025
    });
  }
}

// Create a dense network over all latitudes and longitudes.
// Connections on nearby grid points create a web across the globe.
const gridNodes = [];
const latitudeCount = 17;
const longitudeCount = 36;

for (let row = 0; row <= latitudeCount; row++) {
  const lat = -85 + row * 170 / latitudeCount;
  const rowNodes = [];

  for (let col = 0; col < longitudeCount; col++) {
    const lon = -180 + col * 360 / longitudeCount;
    const point = new THREE.Vector3();

    const phi = (90 - lat) * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;

    point.set(
      -R * 1.023 * Math.sin(phi) * Math.cos(theta),
       R * 1.023 * Math.cos(phi),
       R * 1.023 * Math.sin(phi) * Math.sin(theta)
    );

    rowNodes.push(point);
  }

  gridNodes.push(rowNodes);
}

let routeIndex = 0;

// Horizontal connections along latitude bands
for (let row = 0; row < gridNodes.length; row++) {
  const rowNodes = gridNodes[row];

  for (let col = 0; col < longitudeCount; col++) {
    const next = (col + 1) % longitudeCount;

    addRoute(
      rowNodes[col],
      rowNodes[next],
      routeIndex++,
      {
        lift: 0.025 + Math.random() * 0.11,
        segments: 10
      }
    );

    // Additional longitude-spanning links
    if (col % 2 === 0 && rowNodes.length > 0) {
      const farther = (col + 2) % longitudeCount;

      addRoute(
        rowNodes[col],
        rowNodes[farther],
        routeIndex++,
        {
          lift: 0.06 + Math.random() * 0.17,
          segments: 12
        }
      );
    }
  }
}

// Vertical connections along longitude bands
for (let row = 0; row < latitudeCount; row++) {
  for (let col = 0; col < longitudeCount; col++) {
    const a = gridNodes[row][col];
    const b = gridNodes[row + 1][col];

    addRoute(a, b, routeIndex++, {
      lift: 0.035 + Math.random() * 0.12,
      segments: 10
    });

    // Diagonal cross-links make the grid look interwoven.
    const nextCol = (col + 1) % longitudeCount;

    if ((row + col) % 2 === 0) {
      addRoute(
        a,
        gridNodes[row + 1][nextCol],
        routeIndex++,
        {
          lift: 0.08 + Math.random() * 0.25,
          segments: 15
        }
      );
    } else if (col % 3 === 0) {
      const prevCol = (col - 1 + longitudeCount) % longitudeCount;

      addRoute(
        a,
        gridNodes[row + 1][prevCol],
        routeIndex++,
        {
          lift: 0.08 + Math.random() * 0.23,
          segments: 15
        }
      );
    }
  }
}

// Major energy hubs distributed around the globe
const hubSpecs = [
  [40, -74], [51.5, -0.1], [24.9, 67], [23.8, 90.4],
  [35.7, 139.7], [19, 72.8], [-33.9, 151.2],
  [1.3, 103.8], [30, 31], [-23.5, -46.6],
  [37.6, 127], [55.8, 37.6], [48.8, 2.3],
  [25.2, 55.3], [-1.3, 36.8], [43.7, -79.4],
  [34, -118.2], [39.9, 116.4], [-34.6, -58.4],
  [52.5, 13.4], [41.9, 12.5], [28.6, 77.2],
  [13.1, 80.3], [31.2, 121.5], [14.6, 121],
  [-26.2, 28], [19.4, -99.1], [59.9, 30.3],
  [60.2, 24.9], [-36.8, 174.8], [35.7, 51.4],
  [33.3, 44.4], [6.5, 3.4], [-4.3, 15.3],
  [45.5, -73.6], [49.3, -123.1], [10.8, 106.7]
];

function latLon(lat, lon, radius = R * 1.03) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;

  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

const hubs = hubSpecs.map(([lat, lon]) => latLon(lat, lon));
const hubGeometry = new THREE.SphereGeometry(0.035, 8, 8);
const hubMaterial = new THREE.MeshBasicMaterial({ color: 0x9bfff9 });
const hubMeshes = [];

hubs.forEach((point, i) => {
  const node = new THREE.Mesh(hubGeometry, hubMaterial);
  node.position.copy(point);
  network.add(node);
  hubMeshes.push(node);

  // Extra local links from each hub to nearby grid nodes.
  const nearby = [];

  gridNodes.flat().forEach(gridPoint => {
    const distance = point.distanceTo(gridPoint);
    if (distance < 0.72) nearby.push({ point: gridPoint, distance });
  });

  nearby.sort((a, b) => a.distance - b.distance);

  nearby.slice(0, 5).forEach((item, j) => {
    addRoute(point, item.point, routeIndex++, {
      lift: 0.13 + Math.random() * 0.32,
      segments: 20
    });
  });

  // Connect hubs to several other distant hubs.
  const otherHubs = hubs
    .map((other, index) => ({
      point: other,
      index,
      distance: point.distanceTo(other)
    }))
    .filter(item => item.index !== i)
    .sort((a, b) => a.distance - b.distance);

  otherHubs.slice(0, 7).forEach((item, j) => {
    if (item.index > i) {
      addRoute(point, item.point, routeIndex++, {
        lift: 0.18 + Math.random() * 0.7,
        segments: 30
      });
    }
  });
});

// Additional long routes: these deliberately cross the existing grid.
const longRouteCount = 125;

for (let i = 0; i < longRouteCount; i++) {
  const start = randomSpherePoint(R * 1.022);
  const end = randomSpherePoint(R * 1.022);

  addRoute(start, end, routeIndex++, {
    lift: 0.25 + Math.random() * 1.0,
    segments: 38
  });
}

// Another layer of medium-length links to close visible gaps.
const mediumRouteCount = 110;

for (let i = 0; i < mediumRouteCount; i++) {
  const start = randomSpherePoint(R * 1.024);
  const end = randomSpherePoint(R * 1.024);

  addRoute(start, end, routeIndex++, {
    lift: 0.10 + Math.random() * 0.65,
    segments: 30
  });
}

// Bright pulses travelling across the network
const pulseMaterial = new THREE.MeshBasicMaterial({
  color: 0xa5fff5
});

const pulseGeometry = new THREE.SphereGeometry(0.034, 8, 8);
const pulses = [];

tracks.forEach(track => {
  const pulse = new THREE.Mesh(pulseGeometry, pulseMaterial);
  pulse.scale.setScalar(0.55 + Math.random() * 0.8);
  network.add(pulse);

  pulses.push({
    mesh: pulse,
    points: track.points,
    phase: track.phase,
    speed: track.speed
  });
});

// Additional tiny cyan points on a subset of routes
const tinyGeometry = new THREE.SphereGeometry(0.015, 6, 6);
const tinyMaterial = new THREE.MeshBasicMaterial({ color: 0x32cfff });

for (let i = 0; i < 65; i++) {
  const track = tracks[Math.floor(Math.random() * tracks.length)];
  const mesh = new THREE.Mesh(tinyGeometry, tinyMaterial);
  network.add(mesh);

  pulses.push({
    mesh,
    points: track.points,
    phase: Math.random(),
    speed: 0.25 + Math.random() * 0.65
  });
}

// Animate
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);
  const elapsed = clock.elapsedTime;

  earthGroup.rotation.y += delta * 0.045;
  earthGroup.rotation.x = 0.035 + Math.sin(elapsed * 0.15) * 0.018;
  stars.rotation.y += delta * 0.002;

  pulses.forEach(item => {
    item.phase = (item.phase + delta * item.speed) % 1;

    const points = item.points;
    const position = item.phase * (points.length - 1);
    const index = Math.floor(position);
    const next = Math.min(index + 1, points.length - 1);
    const fraction = position - index;

    item.mesh.position.copy(
      points[index].clone().lerp(points[next], fraction)
    );
  });

  hubMeshes.forEach((node, i) => {
    const s = 1 + Math.sin(elapsed * 2.0 + i) * 0.18;
    node.scale.setScalar(s);
  });

  renderer.render(scene, camera);
}

// Responsive layout
function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;

  camera.aspect = width / height;

  if (width < 620) {
    camera.position.z = 9.3;
    earthGroup.scale.setScalar(0.82);
  } else if (width < 900) {
    camera.position.z = 8.8;
    earthGroup.scale.setScalar(0.92);
  } else {
    camera.position.z = 8.8;
    earthGroup.scale.setScalar(1);
  }

  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
}

window.addEventListener("resize", resize);
resize();
animate();
</script>
</body>
</html>
