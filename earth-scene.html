
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumora — Global Energy Network</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#scene{width:100%;height:100%;overflow:hidden;background:#071321}
body{font-family:Arial,Helvetica,sans-serif}
#scene{position:absolute;inset:0}
canvas{display:block}
.heading{position:absolute;top:25px;left:27px;z-index:2;pointer-events:none}
.eyebrow{color:#67eaff;font-size:11px;font-weight:bold;letter-spacing:3px;margin-bottom:10px}
h1{color:#eafaff;font-size:clamp(24px,3.7vw,36px);line-height:1.13;letter-spacing:-1px;text-shadow:0 0 20px #00a9db44}
h1 span{color:#60e8ff}
.subtitle{margin-top:10px;color:#8db9d0;font-size:10px;letter-spacing:1.6px}
.metrics{position:absolute;top:50%;right:22px;transform:translateY(-38%);z-index:3;width:154px;display:grid;gap:11px;pointer-events:none}
.metric{padding:12px 13px;border:1px solid #35cafa55;border-radius:14px;background:#091b2be8;backdrop-filter:blur(10px)}
.label{font-size:9px;color:#94bfd4;letter-spacing:1.2px}
.value{margin-top:5px;color:#79efff;font-size:26px;font-weight:bold}
.unit{font-size:12px}
.note{margin-top:4px;color:#8daabd;font-size:9px}
.legend{position:absolute;bottom:49px;left:25px;z-index:2;display:grid;gap:7px;color:#83a9bc;font-size:9px;letter-spacing:.5px;pointer-events:none}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:16px;height:2px;display:inline-block;background:#29cfff;box-shadow:0 0 5px #29cfff}
.legend .bright{background:#8bfff0;box-shadow:0 0 5px #8bfff0}
.footer{position:absolute;bottom:18px;left:24px;right:24px;z-index:2;display:flex;justify-content:space-between;gap:8px;color:#83a9bc;font-size:9px;letter-spacing:.7px;pointer-events:none}
.live{display:flex;align-items:center;gap:7px}
.dot{width:6px;height:6px;border-radius:50%;background:#6effd7;box-shadow:0 0 8px #6effd7;animation:blink 1.6s infinite}
.frame{position:absolute;inset:13px;z-index:4;border:1px solid #4dc8ef30;border-radius:23px;pointer-events:none}
@keyframes blink{50%{opacity:.45}}
@media(max-width:620px){
.heading{top:22px;left:20px}
.eyebrow{font-size:9px;letter-spacing:2px}
h1{font-size:26px}
.subtitle{font-size:9px}
.metrics{top:auto;right:17px;bottom:68px;transform:none;width:122px;gap:7px}
.metric{padding:9px;border-radius:10px}
.label{font-size:8px;letter-spacing:.6px}
.value{font-size:21px}
.note{font-size:8px}
.legend{left:20px;bottom:47px;font-size:8px;gap:6px}
.footer{left:20px;right:20px;font-size:8px}
.frame{inset:8px;border-radius:16px}
}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<div id="scene"></div>

<div class="heading">
  <div class="eyebrow">LUMORA / ENERGY INTELLIGENCE</div>
  <h1>Powering a <span>Brighter</span><br>Connected World.</h1>
  <div class="subtitle">GLOBAL ELECTRICITY NETWORK</div>
</div>

<div class="metrics">
  <div class="metric">
    <div class="label">GRID VOLTAGE</div>
    <div class="value">230 <span class="unit">V</span></div>
    <div class="note">Illustrative demo</div>
  </div>
  <div class="metric">
    <div class="label">ENERGY FLOW</div>
    <div class="value">3.8 <span class="unit">kW</span></div>
    <div class="note">Illustrative demo</div>
  </div>
  <div class="metric">
    <div class="label">CONSUMPTION</div>
    <div class="value">248.6 <span class="unit">kWh</span></div>
    <div class="note">Sample data only</div>
  </div>
</div>

<div class="legend">
  <span><i></i> GRID TRANSMISSION LINES</span>
  <span><i class="bright"></i> ENERGY PULSES</span>
</div>

<div class="footer">
  <span class="live"><i class="dot"></i> ROTATING PLANET</span>
  <span>POWERING TOMORROW</span>
</div>
<div class="frame"></div>

<script type="module">
import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const container = document.getElementById("scene");
const scene = new THREE.Scene();
scene.background = new THREE.Color("#071321");

const camera = new THREE.PerspectiveCamera(
  43, innerWidth / innerHeight, 0.1, 100
);
camera.position.z = 8.8;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const earthGroup = new THREE.Group();
scene.add(earthGroup);
const R = 2.25;

// Earth
const earthMaterial = new THREE.MeshPhongMaterial({
  color: 0x236b9b,
  shininess: 20,
  specular: new THREE.Color(0x163e62)
});

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(R, 64, 48),
  earthMaterial
);
earthGroup.add(earth);

new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",
  texture => {
    texture.colorSpace = THREE.SRGBColorSpace;
    earthMaterial.map = texture;
    earthMaterial.color.set(0xffffff);
    earthMaterial.needsUpdate = true;
  }
);

// Atmosphere
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.04, 48, 36),
  new THREE.MeshBasicMaterial({
    color: 0x1baeff,
    transparent: true,
    opacity: 0.055,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
));

// Lighting
scene.add(new THREE.AmbientLight(0x91c9ed, 1.35));

const sunlight = new THREE.DirectionalLight(0xc7efff, 2.1);
sunlight.position.set(-4, 4, 6);
scene.add(sunlight);

const blueLight = new THREE.PointLight(0x00aaff, 22, 12);
blueLight.position.set(2, -1, 3);
scene.add(blueLight);

// Background stars
const starPositions = [];

for (let i = 0; i < 650; i++) {
  const r = 5 + Math.random() * 13;
  const z = Math.random() * 2 - 1;
  const a = Math.random() * Math.PI * 2;
  const q = Math.sqrt(1 - z * z);

  starPositions.push(
    r * q * Math.cos(a),
    r * q * Math.sin(a),
    r * z
  );
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: 0x8bdfff,
    size: 0.015,
    transparent: true,
    opacity: 0.58
  })
);
scene.add(stars);

// Latitude-longitude globe mesh
earthGroup.add(new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.006, 36, 26),
  new THREE.MeshBasicMaterial({
    color: 0x31bdff,
    wireframe: true,
    transparent: true,
    opacity: 0.19,
    depthWrite: false
  })
));

function pointOnSphere(lat, lon, radius = R * 1.018) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;

  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
     radius * Math.cos(phi),
     radius * Math.sin(phi) * Math.sin(theta)
  );
}

function randomPoint(radius = R * 1.02) {
  const z = Math.random() * 2 - 1;
  const a = Math.random() * Math.PI * 2;
  const q = Math.sqrt(1 - z * z);

  return new THREE.Vector3(
    radius * q * Math.cos(a),
    radius * z,
    radius * q * Math.sin(a)
  );
}

// Curved cable path
function arcPoints(start, end, lift, segments = 38) {
  const a = start.clone().normalize();
  const b = end.clone().normalize();
  const angle = a.angleTo(b);
  const points = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    let direction;

    if (angle < 0.001 || Math.abs(Math.sin(angle)) < 0.0001) {
      direction = a.clone().lerp(b, t).normalize();
    } else {
      const s = Math.sin(angle);

      direction = a.clone()
        .multiplyScalar(Math.sin((1 - t) * angle) / s)
        .add(
          b.clone().multiplyScalar(Math.sin(t * angle) / s)
        )
        .normalize();
    }

    const h = Math.sin(Math.PI * t) * lift;
    points.push(direction.multiplyScalar(R * 1.018 + h));
  }

  return points;
}

const network = new THREE.Group();
earthGroup.add(network);

const cableMaterials = [
  new THREE.LineBasicMaterial({
    color: 0x21caff,
    transparent: true,
    opacity: 0.39,
    depthWrite: false
  }),
  new THREE.LineBasicMaterial({
    color: 0x1688df,
    transparent: true,
    opacity: 0.31,
    depthWrite: false
  }),
  new THREE.LineBasicMaterial({
    color: 0x42e8ff,
    transparent: true,
    opacity: 0.27,
    depthWrite: false
  })
];

const tracks = [];
let cableIndex = 0;

function addCable(start, end, options = {}) {
  const lift = options.lift ?? (0.08 + Math.random() * 0.45);

  const points = arcPoints(
    start,
    end,
    lift,
    options.segments || 32
  );

  const material =
    cableMaterials[cableIndex++ % cableMaterials.length];

  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    material
  );

  network.add(line);

  if (options.pulse !== false) {
    tracks.push({
      points,
      phase: Math.random(),
      speed: 0.10 + Math.random() * 0.25
    });
  }
}

// Balanced grid density: columns reduced from 28 to 26.
// Latitude rows are unchanged.
const rows = 14;
const cols = 26;
const grid = [];

for (let row = 0; row <= rows; row++) {
  const lat = -82 + row * 164 / rows;
  const points = [];

  for (let col = 0; col < cols; col++) {
    const lon = -180 + col * 360 / cols;
    points.push(pointOnSphere(lat, lon));
  }

  grid.push(points);
}

// Horizontal, vertical and selected diagonal cables
for (let row = 0; row <= rows; row++) {
  for (let col = 0; col < cols; col++) {
    const next = (col + 1) % cols;

    addCable(grid[row][col], grid[row][next], {
      lift: 0.025 + Math.random() * 0.06,
      segments: 10
    });

    if (row < rows) {
      addCable(grid[row][col], grid[row + 1][col], {
        lift: 0.025 + Math.random() * 0.07,
        segments: 10
      });

      if ((row + col) % 3 === 0) {
        addCable(grid[row][col], grid[row + 1][next], {
          lift: 0.07 + Math.random() * 0.13,
          segments: 15
        });
      }
    }
  }
}

// Regional energy hubs
const hubSpecs = [
  [40,-74],[51.5,-0.1],[24.9,67],[23.8,90.4],
  [35.7,139.7],[19,72.8],[-33.9,151.2],[1.3,103.8],
  [30,31],[-23.5,-46.6],[37.6,127],[55.8,37.6],
  [48.8,2.3],[25.2,55.3],[-1.3,36.8],[43.7,-79.4],
  [34,-118.2],[39.9,116.4],[-34.6,-58.4],[52.5,13.4],
  [41.9,12.5],[28.6,77.2],[13.1,80.3],[31.2,121.5],
  [14.6,121],[-26.2,28],[19.4,-99.1],[60.2,24.9]
];

const hubs = hubSpecs.map(([lat, lon]) =>
  pointOnSphere(lat, lon, R * 1.025)
);

// Ball geometry and materials intentionally unchanged
const nodeGeometry = new THREE.SphereGeometry(0.022, 7, 7);
const nodeMaterial = new THREE.MeshBasicMaterial({
  color: 0x8bf6ff
});

const hubMeshes = [];

hubs.forEach((hub, i) => {
  const node = new THREE.Mesh(nodeGeometry, nodeMaterial);
  node.position.copy(hub);
  network.add(node);
  hubMeshes.push(node);

  // Connect hubs to three nearby grid points
  const candidates = grid.flat().map(point => ({
    point,
    distance: point.distanceTo(hub)
  })).sort((a, b) => a.distance - b.distance);

  candidates.slice(0, 3).forEach(item => {
    addCable(hub, item.point, {
      lift: 0.10 + Math.random() * 0.25,
      segments: 20
    });
  });

  // Keep the hub-to-hub cross-connections
  const others = hubs.map((point, index) => ({
    point,
    index,
    distance: point.distanceTo(hub)
  }))
  .filter(item => item.index !== i)
  .sort((a, b) => a.distance - b.distance);

  others.slice(0, 2).forEach(item => {
    if (item.index > i) {
      addCable(hub, item.point, {
        lift: 0.18 + Math.random() * 0.45,
        segments: 28
      });
    }
  });
});

// Long-distance wires reduced from 48 to 43
for (let i = 0; i < 43; i++) {
  addCable(randomPoint(), randomPoint(), {
    lift: 0.22 + Math.random() * 0.65,
    segments: 34
  });
}

// Small glowing pulses: unchanged geometry and brightness
const pulseGeometry = new THREE.SphereGeometry(0.016, 6, 6);
const pulseMaterial = new THREE.MeshBasicMaterial({
  color: 0x9bfff5
});

const pulses = [];

// Keep the same one-in-three pulse selection
tracks.forEach((track, index) => {
  if (index % 3 !== 0) return;

  const mesh = new THREE.Mesh(pulseGeometry, pulseMaterial);
  network.add(mesh);

  pulses.push({
    mesh,
    points: track.points,
    phase: track.phase,
    speed: track.speed
  });
});

// Animation
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);
  const elapsed = clock.elapsedTime;

  earthGroup.rotation.y += delta * 0.043;
  earthGroup.rotation.x =
    0.025 + Math.sin(elapsed * 0.12) * 0.015;

  stars.rotation.y += delta * 0.002;

  pulses.forEach(item => {
    item.phase = (item.phase + delta * item.speed) % 1;

    const position = item.phase * (item.points.length - 1);
    const index = Math.floor(position);
    const next = Math.min(index + 1, item.points.length - 1);
    const fraction = position - index;

    item.mesh.position.copy(
      item.points[index].clone().lerp(
        item.points[next],
        fraction
      )
    );
  });

  // Keep node sizes and animation unchanged
  hubMeshes.forEach((node, i) => {
    node.scale.setScalar(
      1 + Math.sin(elapsed * 1.4 + i) * 0.09
    );
  });

  renderer.render(scene, camera);
}

// Responsive sizing
function resize() {
  const width = innerWidth;
  const height = innerHeight;

  camera.aspect = width / height;

  if (width < 620) {
    camera.position.z = 9.2;
    earthGroup.scale.setScalar(0.82);
  } else if (width < 900) {
    camera.position.z = 8.8;
    earthGroup.scale.setScalar(0.91);
  } else {
    camera.position.z = 8.8;
    earthGroup.scale.setScalar(1);
  }

  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  renderer.setPixelRatio(
    Math.min(devicePixelRatio || 1, 1.5)
  );
}

window.addEventListener("resize", resize);
resize();
animate();
</script>
</body>
</html>
